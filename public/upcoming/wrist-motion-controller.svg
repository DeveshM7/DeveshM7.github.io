<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="wm_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <marker id="wm_ah" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#wm_bg)"/>

  <text x="800" y="120" text-anchor="middle" font-size="24" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">on-device gesture recognition &#8594; wireless control</text>

  <!-- IMU -->
  <rect x="80" y="420" width="300" height="180" rx="16" fill="#161d26" stroke="#3a4554" stroke-width="2"/>
  <circle cx="150" cy="480" r="20" fill="#0d1014" stroke="#7dd3fc" stroke-width="2"/>
  <path d="M150 468 L150 492 M138 480 L162 480" stroke="#7dd3fc" stroke-width="2"/>
  <text x="230" y="488" text-anchor="middle" font-size="26" fill="#f5f7fa">6-axis IMU</text>
  <text x="230" y="530" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">accel + gyro</text>
  <text x="230" y="560" text-anchor="middle" font-size="16" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">100 Hz &#183; I2C</text>

  <line x1="380" y1="510" x2="446" y2="510" stroke="#7dd3fc" stroke-width="3" marker-end="url(#wm_ah)"/>

  <!-- RP2350B -->
  <rect x="450" y="400" width="340" height="220" rx="16" fill="#1a2330" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="486" y="436" width="60" height="60" rx="8" fill="#0d1014" stroke="#7dd3fc" stroke-width="2"/>
  <path d="M496 452 h40 M496 466 h40 M496 480 h40" stroke="#7dd3fc" stroke-width="2"/>
  <text x="640" y="472" text-anchor="middle" font-size="26" fill="#f5f7fa">RP2350B</text>
  <text x="640" y="508" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">1D CNN &#183; int8</text>
  <text x="640" y="536" text-anchor="middle" font-size="16" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">on-device inference</text>
  <text x="640" y="592" text-anchor="middle" font-size="15" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">gesture-spotting firmware</text>

  <line x1="790" y1="510" x2="856" y2="510" stroke="#7dd3fc" stroke-width="3" marker-end="url(#wm_ah)"/>

  <!-- nRF52840 -->
  <rect x="860" y="420" width="300" height="180" rx="16" fill="#161d26" stroke="#3a4554" stroke-width="2"/>
  <path d="M990 450 v100 M990 450 l28 22 l-28 22 v-44 l-28 22 l28 22" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1040" y="480" text-anchor="middle" font-size="26" fill="#f5f7fa">nRF52840</text>
  <text x="1040" y="516" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">BLE radio</text>
  <text x="1040" y="546" text-anchor="middle" font-size="16" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">co-processor</text>

  <line x1="1160" y1="510" x2="1226" y2="510" stroke="#7dd3fc" stroke-width="3" marker-end="url(#wm_ah)" stroke-dasharray="8 6"/>
  <text x="1193" y="490" text-anchor="middle" font-size="15" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">BLE</text>

  <!-- Laptop -->
  <rect x="1230" y="440" width="290" height="140" rx="16" fill="#16241c" stroke="#5ad19a" stroke-width="2"/>
  <rect x="1268" y="466" width="80" height="56" rx="6" fill="#0d1014" stroke="#5ad19a" stroke-width="2"/>
  <path d="M1268 522 h80 M1258 534 h100" stroke="#5ad19a" stroke-width="3" stroke-linecap="round"/>
  <text x="1420" y="490" text-anchor="middle" font-size="24" fill="#f5f7fa">Laptop</text>
  <text x="1420" y="522" text-anchor="middle" font-size="15" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">media &#183; volume</text>
  <text x="1420" y="546" text-anchor="middle" font-size="15" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">&amp; scroll control</text>

  <!-- gesture arcs decoration -->
  <path d="M 150 700 A 220 220 0 0 1 590 700" fill="none" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M 250 780 A 320 320 0 0 1 750 780" fill="none" stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="400" y="860" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">flicks &#183; rotation &#183; double-tap</text>
</svg>
