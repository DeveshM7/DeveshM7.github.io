<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="ia_bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="45%" stop-color="#241b4d"/>
      <stop offset="78%" stop-color="#2c4a72"/>
      <stop offset="100%" stop-color="#4fb8d6"/>
    </linearGradient>
    <radialGradient id="ia_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fe6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9fe6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ia_glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ia_wingL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3f8"/>
      <stop offset="100%" stop-color="#c9d3de"/>
    </linearGradient>
    <linearGradient id="ia_wingR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6ee"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#ia_bg)"/>

  <!-- atmosphere glows -->
  <ellipse cx="1180" cy="260" rx="520" ry="420" fill="url(#ia_glow)"/>
  <ellipse cx="300" cy="820" rx="420" ry="320" fill="url(#ia_glow2)"/>

  <!-- motion trail streaking from lower-left to the plane -->
  <g stroke-linecap="round" fill="none">
    <path d="M -40 940 C 260 800, 420 760, 660 640" stroke="#9fe6ff" stroke-opacity="0.55" stroke-width="10"/>
    <path d="M 10 990 C 300 860, 470 810, 730 690" stroke="#9fe6ff" stroke-opacity="0.32" stroke-width="7"/>
    <path d="M 90 1020 C 340 910, 500 860, 780 730" stroke="#ffd27a" stroke-opacity="0.28" stroke-width="5"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M240 200 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 Z" opacity="0.9"/>
    <path d="M1360 620 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 Z" fill="#ffd27a" opacity="0.85"/>
    <path d="M1080 160 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 Z" opacity="0.8"/>
    <circle cx="420" cy="360" r="5" opacity="0.8"/>
    <circle cx="980" cy="700" r="4" fill="#ffd27a" opacity="0.7"/>
    <circle cx="1220" cy="480" r="6" opacity="0.75"/>
    <circle cx="650" cy="560" r="4" opacity="0.6"/>
    <circle cx="1440" cy="300" r="5" fill="#ffd27a" opacity="0.7"/>
  </g>

  <!-- paper airplane, folded from a resume, banking up and to the right -->
  <g transform="translate(980,520) rotate(-32)">
    <!-- soft shadow beneath -->
    <ellipse cx="0" cy="150" rx="260" ry="34" fill="#000000" opacity="0.18"/>

    <!-- right (near) wing -->
    <path d="M0 -230 L 230 140 L 30 90 Z" fill="url(#ia_wingR)"/>
    <!-- left (far) wing, slightly darker for fold depth -->
    <path d="M0 -230 L -230 150 L -20 95 Z" fill="url(#ia_wingL)"/>
    <!-- center fold spine -->
    <path d="M0 -230 L 10 120 L 0 150 L -10 120 Z" fill="#aeb9c6"/>

    <!-- resume text lines on the near wing -->
    <g stroke="#7dd3fc" stroke-width="6" stroke-linecap="round">
      <path d="M40 20 L170 60"/>
      <path d="M35 45 L150 78" stroke="#9aa4b2" stroke-opacity="0.7"/>
      <path d="M30 70 L120 92" stroke="#9aa4b2" stroke-opacity="0.5"/>
    </g>
  </g>

  <!-- small orbiting accent dots trailing further applications -->
  <g fill="#7dd3fc">
    <circle cx="560" cy="820" r="10" opacity="0.85"/>
    <circle cx="700" cy="880" r="7" opacity="0.6"/>
    <circle cx="440" cy="760" r="6" opacity="0.5"/>
  </g>
</svg>
