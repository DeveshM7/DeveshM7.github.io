<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="a_ah" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7dd3fc"/></marker>
    <marker id="a_ahm" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7686"/></marker>
  </defs>
  <rect x="2" y="2" width="1596" height="1036" rx="24" fill="#0d1014" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Terminal -->
  <rect x="560" y="44" width="480" height="112" rx="14" fill="#131922" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="800" y="92" text-anchor="middle" font-size="29" fill="#f5f7fa">Terminal</text>
  <text x="800" y="128" text-anchor="middle" font-size="21" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">myshell&gt; ls -al | grep .c | wc -l</text>

  <line x1="800" y1="156" x2="800" y2="212" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#a_ah)"/>
  <text x="818" y="192" font-size="19" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">command line</text>

  <!-- Shell process -->
  <rect x="140" y="218" width="1320" height="330" rx="18" fill="#10151c" stroke="#7dd3fc" stroke-opacity="0.5" stroke-dasharray="7 6"/>
  <text x="172" y="258" font-size="23" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">myshell — one process</text>

  <g>
    <rect x="200" y="296" width="270" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="335" y="366" text-anchor="middle" font-size="25" fill="#f5f7fa">Lexer</text>
    <text x="335" y="400" text-anchor="middle" font-size="18" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">Flex · tokens</text>

    <rect x="510" y="296" width="270" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="645" y="366" text-anchor="middle" font-size="25" fill="#f5f7fa">Parser</text>
    <text x="645" y="400" text-anchor="middle" font-size="18" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">Yacc</text>

    <rect x="820" y="296" width="270" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="955" y="358" text-anchor="middle" font-size="24" fill="#f5f7fa">Command tree</text>
    <text x="955" y="392" text-anchor="middle" font-size="18" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">ListCommands</text>

    <rect x="1130" y="296" width="270" height="150" rx="12" fill="#1a2330" stroke="#7dd3fc"/>
    <text x="1265" y="366" text-anchor="middle" font-size="25" fill="#f5f7fa">Executor</text>
    <text x="1265" y="400" text-anchor="middle" font-size="18" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">walks the tree</text>

    <line x1="470" y1="371" x2="506" y2="371" stroke="#6b7686" stroke-width="2.5" marker-end="url(#a_ahm)"/>
    <line x1="780" y1="371" x2="816" y2="371" stroke="#6b7686" stroke-width="2.5" marker-end="url(#a_ahm)"/>
    <line x1="1090" y1="371" x2="1126" y2="371" stroke="#6b7686" stroke-width="2.5" marker-end="url(#a_ahm)"/>

    <text x="955" y="500" text-anchor="middle" font-size="18" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">node types: Pipe · If · While · For</text>
  </g>

  <line x1="1265" y1="548" x2="1265" y2="608" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#a_ah)"/>
  <text x="1283" y="586" font-size="19" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">fork() · execvp() · pipe()</text>

  <!-- Kernel -->
  <rect x="140" y="614" width="1320" height="330" rx="18" fill="#10151c" stroke="#2a3340"/>
  <text x="172" y="654" font-size="23" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">Linux kernel — runs each stage as a child process</text>

  <g>
    <rect x="250" y="700" width="300" height="150" rx="12" fill="#1d1a12" stroke="#f0b35b"/>
    <text x="400" y="770" text-anchor="middle" font-size="26" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">ls -al</text>
    <text x="400" y="806" text-anchor="middle" font-size="18" fill="#c8a978">child 1</text>

    <rect x="650" y="700" width="300" height="150" rx="12" fill="#1d1a12" stroke="#f0b35b"/>
    <text x="800" y="770" text-anchor="middle" font-size="26" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">grep .c</text>
    <text x="800" y="806" text-anchor="middle" font-size="18" fill="#c8a978">child 2</text>

    <rect x="1050" y="700" width="300" height="150" rx="12" fill="#1d1a12" stroke="#f0b35b"/>
    <text x="1200" y="770" text-anchor="middle" font-size="26" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">wc -l</text>
    <text x="1200" y="806" text-anchor="middle" font-size="18" fill="#c8a978">child 3</text>

    <line x1="550" y1="775" x2="646" y2="775" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#a_ah)"/>
    <text x="598" y="758" text-anchor="middle" font-size="16" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">pipe</text>
    <line x1="950" y1="775" x2="1046" y2="775" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#a_ah)"/>
    <text x="998" y="758" text-anchor="middle" font-size="16" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">pipe</text>
  </g>

  <!-- clean orthogonal output return on the left margin -->
  <polyline points="250,775 70,775 70,100 556,100" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#a_ah)"/>
  <text x="70" y="445" text-anchor="middle" font-size="19" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace" transform="rotate(-90 70 445)">output → screen</text>
</svg>
