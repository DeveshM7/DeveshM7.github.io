<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="ahm" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7686"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="1596" height="1076" rx="24" fill="#0d1014" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Terminal -->
  <rect x="580" y="40" width="440" height="110" rx="14" fill="#131922" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="800" y="88" text-anchor="middle" font-size="30" fill="#f5f7fa">Terminal</text>
  <text x="800" y="124" text-anchor="middle" font-size="22" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">$ ls -al | grep .c | wc -l</text>

  <line x1="800" y1="150" x2="800" y2="206" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="820" y="186" font-size="20" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">command line</text>

  <!-- Shell process -->
  <rect x="80" y="212" width="1440" height="300" rx="18" fill="#10151c" stroke="#2a3340" stroke-dasharray="7 6"/>
  <text x="112" y="252" font-size="24" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">myshell — one process</text>

  <!-- inner pipeline boxes -->
  <g>
    <rect x="120" y="300" width="230" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="235" y="372" text-anchor="middle" font-size="26" fill="#f5f7fa">Read line</text>
    <text x="235" y="406" text-anchor="middle" font-size="19" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">raw text</text>

    <rect x="430" y="300" width="230" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="545" y="372" text-anchor="middle" font-size="26" fill="#f5f7fa">Lexer</text>
    <text x="545" y="406" text-anchor="middle" font-size="19" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">Flex</text>

    <rect x="740" y="300" width="230" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="855" y="372" text-anchor="middle" font-size="26" fill="#f5f7fa">Parser</text>
    <text x="855" y="406" text-anchor="middle" font-size="19" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">Yacc</text>

    <rect x="1050" y="300" width="230" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="1165" y="364" text-anchor="middle" font-size="26" fill="#f5f7fa">Command</text>
    <text x="1165" y="394" text-anchor="middle" font-size="26" fill="#f5f7fa">tree</text>
    <text x="1165" y="426" text-anchor="middle" font-size="19" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">cmds + I/O</text>

    <rect x="1360" y="300" width="130" height="150" rx="12" fill="#1a2330" stroke="#7dd3fc"/>
    <text x="1425" y="368" text-anchor="middle" font-size="24" fill="#f5f7fa">Exec</text>
    <text x="1425" y="398" text-anchor="middle" font-size="24" fill="#f5f7fa">utor</text>

    <!-- arrows -->
    <line x1="350" y1="375" x2="426" y2="375" stroke="#6b7686" stroke-width="2.5" marker-end="url(#ahm)"/>
    <line x1="660" y1="375" x2="736" y2="375" stroke="#6b7686" stroke-width="2.5" marker-end="url(#ahm)"/>
    <text x="698" y="358" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">tokens</text>
    <line x1="970" y1="375" x2="1046" y2="375" stroke="#6b7686" stroke-width="2.5" marker-end="url(#ahm)"/>
    <text x="1008" y="358" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">tree</text>
    <line x1="1280" y1="375" x2="1356" y2="375" stroke="#6b7686" stroke-width="2.5" marker-end="url(#ahm)"/>
  </g>

  <!-- shell -> kernel -->
  <line x1="1425" y1="512" x2="1425" y2="600" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="1445" y="566" font-size="20" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">system calls</text>

  <!-- Kernel -->
  <rect x="80" y="606" width="1440" height="420" rx="18" fill="#10151c" stroke="#2a3340"/>
  <text x="112" y="646" font-size="24" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">Linux kernel</text>

  <!-- syscall chips -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="22">
    <rect x="120" y="676" width="150" height="56" rx="28" fill="#16202b" stroke="#3a4554"/><text x="195" y="712" text-anchor="middle" fill="#cfd6e0">fork()</text>
    <rect x="290" y="676" width="180" height="56" rx="28" fill="#16202b" stroke="#3a4554"/><text x="380" y="712" text-anchor="middle" fill="#cfd6e0">execvp()</text>
    <rect x="490" y="676" width="150" height="56" rx="28" fill="#16202b" stroke="#3a4554"/><text x="565" y="712" text-anchor="middle" fill="#cfd6e0">pipe()</text>
    <rect x="660" y="676" width="150" height="56" rx="28" fill="#16202b" stroke="#3a4554"/><text x="735" y="712" text-anchor="middle" fill="#cfd6e0">dup2()</text>
    <rect x="830" y="676" width="190" height="56" rx="28" fill="#16202b" stroke="#3a4554"/><text x="925" y="712" text-anchor="middle" fill="#cfd6e0">waitpid()</text>
  </g>

  <!-- child processes -->
  <g>
    <rect x="200" y="800" width="320" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="360" y="868" text-anchor="middle" font-size="26" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">ls -al</text>
    <text x="360" y="904" text-anchor="middle" font-size="19" fill="#9aa4b2">child process</text>

    <rect x="640" y="800" width="320" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="800" y="868" text-anchor="middle" font-size="26" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">grep .c</text>
    <text x="800" y="904" text-anchor="middle" font-size="19" fill="#9aa4b2">child process</text>

    <rect x="1080" y="800" width="320" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="1240" y="868" text-anchor="middle" font-size="26" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">wc -l</text>
    <text x="1240" y="904" text-anchor="middle" font-size="19" fill="#9aa4b2">child process</text>

    <line x1="360" y1="738" x2="360" y2="796" stroke="#6b7686" stroke-width="2.5" marker-end="url(#ahm)"/>
    <line x1="800" y1="738" x2="800" y2="796" stroke="#6b7686" stroke-width="2.5" marker-end="url(#ahm)"/>
    <line x1="1240" y1="738" x2="1240" y2="796" stroke="#6b7686" stroke-width="2.5" marker-end="url(#ahm)"/>
    <text x="1295" y="770" font-size="18" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">spawned</text>
  </g>

  <!-- output back to terminal -->
  <path d="M1400 875 C 1545 875, 1560 95, 1024 95" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <text x="1505" y="500" text-anchor="middle" font-size="20" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace" transform="rotate(90 1505 500)">stdout → screen</text>
</svg>
