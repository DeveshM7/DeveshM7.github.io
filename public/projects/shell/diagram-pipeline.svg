<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="p_ah" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7dd3fc"/></marker>
    <marker id="p_ahm" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7686"/></marker>
  </defs>
  <rect x="2" y="2" width="1596" height="816" rx="24" fill="#0d1014" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="800" y="62" text-anchor="middle" font-size="29" fill="#cfd6e0" font-family="ui-monospace, Menlo, monospace">ls -al <tspan fill="#7dd3fc">|</tspan> grep .c <tspan fill="#7dd3fc">|</tspan> wc -l</text>

  <!-- parent -->
  <rect x="120" y="92" width="1360" height="104" rx="14" fill="#10151c" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="150" y="138" font-size="24" fill="#7dd3fc">myshell (parent)</text>
  <text x="150" y="172" font-size="19" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">forks one child per stage · dup2()s each child's stdout into the next child's stdin · waitpid()s the last</text>

  <!-- fork arrows -->
  <g stroke="#6b7686" stroke-width="2" stroke-dasharray="5 6">
    <line x1="280" y1="196" x2="280" y2="376" marker-end="url(#p_ahm)"/>
    <line x1="800" y1="196" x2="800" y2="376" marker-end="url(#p_ahm)"/>
    <line x1="1320" y1="196" x2="1320" y2="376" marker-end="url(#p_ahm)"/>
  </g>
  <text x="300" y="300" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">fork()</text>

  <!-- children -->
  <g>
    <rect x="120" y="380" width="320" height="170" rx="14" fill="#1d1a12" stroke="#f0b35b"/>
    <text x="280" y="455" text-anchor="middle" font-size="28" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">ls -al</text>
    <text x="280" y="492" text-anchor="middle" font-size="18" fill="#c8a978">child 1</text>

    <rect x="640" y="380" width="320" height="170" rx="14" fill="#1d1a12" stroke="#f0b35b"/>
    <text x="800" y="455" text-anchor="middle" font-size="28" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">grep .c</text>
    <text x="800" y="492" text-anchor="middle" font-size="18" fill="#c8a978">child 2</text>

    <rect x="1160" y="380" width="320" height="170" rx="14" fill="#1d1a12" stroke="#f0b35b"/>
    <text x="1320" y="455" text-anchor="middle" font-size="28" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">wc -l</text>
    <text x="1320" y="492" text-anchor="middle" font-size="18" fill="#c8a978">child 3</text>
  </g>

  <!-- pipes between children (straight) -->
  <g>
    <line x1="448" y1="465" x2="632" y2="465" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#p_ah)"/>
    <rect x="495" y="437" width="90" height="56" rx="28" fill="#0d1014" stroke="#7dd3fc"/>
    <text x="540" y="473" text-anchor="middle" font-size="19" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">pipe</text>

    <line x1="968" y1="465" x2="1152" y2="465" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#p_ah)"/>
    <rect x="1015" y="437" width="90" height="56" rx="28" fill="#0d1014" stroke="#7dd3fc"/>
    <text x="1060" y="473" text-anchor="middle" font-size="19" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">pipe</text>
  </g>

  <!-- fd badges -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="17">
    <circle cx="440" cy="420" r="17" fill="#0d1014" stroke="#7dd3fc"/><text x="440" y="426" text-anchor="middle" fill="#7dd3fc">1</text>
    <circle cx="640" cy="420" r="17" fill="#0d1014" stroke="#7dd3fc"/><text x="640" y="426" text-anchor="middle" fill="#7dd3fc">0</text>
    <circle cx="960" cy="420" r="17" fill="#0d1014" stroke="#7dd3fc"/><text x="960" y="426" text-anchor="middle" fill="#7dd3fc">1</text>
    <circle cx="1160" cy="420" r="17" fill="#0d1014" stroke="#7dd3fc"/><text x="1160" y="426" text-anchor="middle" fill="#7dd3fc">0</text>
  </g>

  <!-- output to terminal -->
  <line x1="1320" y1="550" x2="1320" y2="636" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#p_ah)"/>
  <circle cx="1320" cy="566" r="17" fill="#0d1014" stroke="#7dd3fc"/><text x="1320" y="572" text-anchor="middle" font-size="17" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">1</text>
  <rect x="1160" y="640" width="320" height="100" rx="14" fill="#131922" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="1320" y="690" text-anchor="middle" font-size="24" fill="#f5f7fa">Terminal</text>
  <text x="1320" y="720" text-anchor="middle" font-size="18" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">final output</text>

  <text x="120" y="700" font-size="19" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">fd 0 = stdin</text>
  <text x="120" y="730" font-size="19" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">fd 1 = stdout</text>
</svg>
