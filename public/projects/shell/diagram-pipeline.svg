<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="p_ah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="p_ahm" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7686"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="1596" height="936" rx="24" fill="#0d1014" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- command chip -->
  <text x="800" y="70" text-anchor="middle" font-size="30" fill="#cfd6e0" font-family="ui-monospace, Menlo, monospace">$ ls -al <tspan fill="#7dd3fc">|</tspan> grep .c <tspan fill="#7dd3fc">|</tspan> wc -l</text>

  <!-- parent -->
  <rect x="120" y="110" width="1360" height="120" rx="14" fill="#10151c" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="150" y="158" font-size="26" fill="#7dd3fc">myshell (parent)</text>
  <text x="150" y="196" font-size="21" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">forks one child per stage · wires them with pipes (dup2) · waitpid()</text>

  <!-- fork arrows -->
  <g>
    <line x1="290" y1="230" x2="290" y2="430" stroke="#6b7686" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#p_ahm)"/>
    <line x1="800" y1="230" x2="800" y2="430" stroke="#6b7686" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#p_ahm)"/>
    <line x1="1310" y1="230" x2="1310" y2="430" stroke="#6b7686" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#p_ahm)"/>
    <text x="305" y="345" font-size="18" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">fork()</text>
  </g>

  <!-- child processes -->
  <g>
    <rect x="120" y="430" width="340" height="190" rx="14" fill="#161d26" stroke="#3a4554"/>
    <text x="290" y="510" text-anchor="middle" font-size="30" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">ls -al</text>
    <text x="290" y="548" text-anchor="middle" font-size="20" fill="#9aa4b2">child 1</text>

    <rect x="630" y="430" width="340" height="190" rx="14" fill="#161d26" stroke="#3a4554"/>
    <text x="800" y="510" text-anchor="middle" font-size="30" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">grep .c</text>
    <text x="800" y="548" text-anchor="middle" font-size="20" fill="#9aa4b2">child 2</text>

    <rect x="1140" y="430" width="340" height="190" rx="14" fill="#161d26" stroke="#3a4554"/>
    <text x="1310" y="510" text-anchor="middle" font-size="30" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">wc -l</text>
    <text x="1310" y="548" text-anchor="middle" font-size="20" fill="#9aa4b2">child 3</text>
  </g>

  <!-- fd chips on edges -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="18">
    <circle cx="460" cy="470" r="20" fill="#1a2330" stroke="#7dd3fc"/><text x="460" y="477" text-anchor="middle" fill="#7dd3fc">1</text>
    <circle cx="630" cy="470" r="20" fill="#1a2330" stroke="#7dd3fc"/><text x="630" y="477" text-anchor="middle" fill="#7dd3fc">0</text>
    <circle cx="970" cy="470" r="20" fill="#1a2330" stroke="#7dd3fc"/><text x="970" y="477" text-anchor="middle" fill="#7dd3fc">1</text>
    <circle cx="1140" cy="470" r="20" fill="#1a2330" stroke="#7dd3fc"/><text x="1140" y="477" text-anchor="middle" fill="#7dd3fc">0</text>
  </g>

  <!-- pipes -->
  <g>
    <rect x="490" y="640" width="110" height="60" rx="30" fill="#16202b" stroke="#7dd3fc"/>
    <text x="545" y="678" text-anchor="middle" font-size="20" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">pipe</text>
    <path d="M460 490 L545 490 L545 638" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <path d="M545 702 L545 490 L632 490" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#p_ah)" opacity="0"/>
    <path d="M545 700 L545 490 L628 490" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#p_ah)"/>

    <rect x="1000" y="640" width="110" height="60" rx="30" fill="#16202b" stroke="#7dd3fc"/>
    <text x="1055" y="678" text-anchor="middle" font-size="20" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">pipe</text>
    <path d="M970 490 L1055 490 L1055 638" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <path d="M1055 700 L1055 490 L1138 490" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#p_ah)"/>
  </g>

  <!-- output to terminal -->
  <rect x="1140" y="760" width="340" height="120" rx="14" fill="#131922" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="1310" y="812" text-anchor="middle" font-size="26" fill="#f5f7fa">Terminal</text>
  <text x="1310" y="846" text-anchor="middle" font-size="19" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">final output</text>
  <line x1="1310" y1="620" x2="1310" y2="756" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#p_ah)"/>
  <circle cx="1310" cy="620" r="20" fill="#1a2330" stroke="#7dd3fc"/><text x="1310" y="627" text-anchor="middle" font-size="18" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">1</text>

  <!-- legend -->
  <text x="120" y="900" font-size="19" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">fd 0 = stdin   ·   fd 1 = stdout   —   each pipe connects one child's stdout to the next child's stdin</text>
</svg>
