<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="e_ah" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7dd3fc"/></marker>
    <marker id="e_ahm" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b7686"/></marker>
  </defs>
  <rect x="2" y="2" width="1596" height="716" rx="24" fill="#0d1014" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="60" y="56" font-size="22" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">expandEnvVarsAndWildcards()  —  applied in order:</text>

  <!-- stage boxes -->
  <g>
    <rect x="50" y="290" width="250" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
    <text x="175" y="356" text-anchor="middle" font-size="24" fill="#f5f7fa">Raw args</text>
    <text x="175" y="392" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">${HOME}/*.c</text>

    <rect x="360" y="290" width="250" height="150" rx="12" fill="#1a2330" stroke="#7dd3fc"/>
    <text x="485" y="348" text-anchor="middle" font-size="23" fill="#f5f7fa">1 · Variables</text>
    <text x="485" y="382" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">${VAR} → value</text>
    <text x="485" y="408" text-anchor="middle" font-size="15" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">$? $! $$ ${SHELL}</text>

    <rect x="670" y="290" width="250" height="150" rx="12" fill="#1a2330" stroke="#7dd3fc"/>
    <text x="795" y="348" text-anchor="middle" font-size="23" fill="#f5f7fa">2 · Subshell</text>
    <text x="795" y="384" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">`cmd` → output</text>

    <rect x="980" y="290" width="250" height="150" rx="12" fill="#1a2330" stroke="#7dd3fc"/>
    <text x="1105" y="348" text-anchor="middle" font-size="23" fill="#f5f7fa">3 · Wildcards</text>
    <text x="1105" y="384" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">* ? → matches</text>

    <rect x="1290" y="290" width="250" height="150" rx="12" fill="#16241c" stroke="#5ad19a"/>
    <text x="1415" y="356" text-anchor="middle" font-size="23" fill="#f5f7fa">argv → exec()</text>
    <text x="1415" y="392" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">a.c  b.c</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#7dd3fc" stroke-width="2.5">
    <line x1="300" y1="365" x2="356" y2="365" marker-end="url(#e_ah)"/>
    <line x1="610" y1="365" x2="666" y2="365" marker-end="url(#e_ah)"/>
    <line x1="920" y1="365" x2="976" y2="365" marker-end="url(#e_ah)"/>
    <line x1="1230" y1="365" x2="1286" y2="365" marker-end="url(#e_ah)"/>
  </g>

  <!-- sources -->
  <rect x="345" y="110" width="280" height="86" rx="12" fill="#161d26" stroke="#3a4554"/>
  <text x="485" y="146" text-anchor="middle" font-size="19" fill="#cfd6e0">environment table</text>
  <text x="485" y="176" text-anchor="middle" font-size="17" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">$HOME, $PATH, …</text>
  <line x1="485" y1="196" x2="485" y2="286" stroke="#6b7686" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#e_ahm)"/>

  <rect x="655" y="540" width="280" height="100" rx="12" fill="#161d26" stroke="#3a4554"/>
  <text x="795" y="578" text-anchor="middle" font-size="19" fill="#cfd6e0">nested myshell</text>
  <text x="795" y="608" text-anchor="middle" font-size="16" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">/proc/self/exe</text>
  <line x1="795" y1="540" x2="795" y2="444" stroke="#6b7686" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#e_ahm)"/>

  <rect x="965" y="540" width="280" height="100" rx="12" fill="#161d26" stroke="#3a4554"/>
  <text x="1105" y="578" text-anchor="middle" font-size="19" fill="#cfd6e0">directory entries</text>
  <text x="1105" y="608" text-anchor="middle" font-size="16" fill="#9aa4b2" font-family="ui-monospace, Menlo, monospace">opendir() + regex</text>
  <line x1="1105" y1="540" x2="1105" y2="444" stroke="#6b7686" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#e_ahm)"/>
</svg>
