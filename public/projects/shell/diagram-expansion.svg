<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="e_ah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="e_ahm" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7686"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="1596" height="776" rx="24" fill="#0d1014" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="800" y="62" text-anchor="middle" font-size="28" fill="#cfd6e0" font-family="ui-monospace, Menlo, monospace">$ echo ~/src/*.c</text>

  <!-- sources -->
  <rect x="120" y="110" width="520" height="80" rx="12" fill="#161d26" stroke="#3a4554"/>
  <text x="148" y="148" font-size="20" fill="#9aa4b2">environment</text>
  <text x="148" y="176" font-size="20" fill="#cfd6e0" font-family="ui-monospace, Menlo, monospace">$HOME = /home/dev</text>

  <rect x="820" y="560" width="520" height="90" rx="12" fill="#161d26" stroke="#3a4554"/>
  <text x="848" y="600" font-size="20" fill="#9aa4b2">filesystem</text>
  <text x="848" y="630" font-size="20" fill="#cfd6e0" font-family="ui-monospace, Menlo, monospace">/home/dev/src/ → a.c b.c</text>

  <!-- stage boxes -->
  <rect x="90" y="330" width="300" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
  <text x="240" y="402" text-anchor="middle" font-size="26" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">~/src/*.c</text>
  <text x="240" y="440" text-anchor="middle" font-size="19" fill="#9aa4b2">raw argument</text>

  <rect x="540" y="330" width="380" height="150" rx="12" fill="#161d26" stroke="#3a4554"/>
  <text x="730" y="402" text-anchor="middle" font-size="25" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">/home/dev/src/*.c</text>
  <text x="730" y="440" text-anchor="middle" font-size="19" fill="#9aa4b2">after ~ expansion</text>

  <rect x="1070" y="330" width="420" height="150" rx="12" fill="#1a2330" stroke="#7dd3fc"/>
  <text x="1280" y="402" text-anchor="middle" font-size="24" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">src/a.c  src/b.c</text>
  <text x="1280" y="440" text-anchor="middle" font-size="19" fill="#9aa4b2">after wildcard glob</text>

  <!-- transition arrows -->
  <line x1="390" y1="405" x2="536" y2="405" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#e_ah)"/>
  <text x="463" y="388" text-anchor="middle" font-size="19" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">tilde ~</text>

  <line x1="920" y1="405" x2="1066" y2="405" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#e_ah)"/>
  <text x="993" y="388" text-anchor="middle" font-size="19" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">glob * ?</text>

  <!-- source feeds -->
  <line x1="463" y1="190" x2="463" y2="392" stroke="#6b7686" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#e_ahm)"/>
  <line x1="993" y1="556" x2="993" y2="420" stroke="#6b7686" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#e_ahm)"/>

  <!-- to exec -->
  <line x1="1280" y1="480" x2="1280" y2="556" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#e_ah)" opacity="0"/>
  <rect x="1080" y="560" width="0" height="0" />

  <!-- exec box (bottom-left flow continues) -->
  <rect x="540" y="560" width="240" height="90" rx="12" fill="#1a2330" stroke="#7dd3fc"/>
  <text x="660" y="600" text-anchor="middle" font-size="23" fill="#f5f7fa" font-family="ui-monospace, Menlo, monospace">exec()</text>
  <text x="660" y="628" text-anchor="middle" font-size="18" fill="#9aa4b2">final argv</text>
  <path d="M1070 470 C 760 540, 800 560, 784 588" fill="none" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#e_ah)"/>
  <text x="900" y="520" text-anchor="middle" font-size="18" fill="#7dd3fc" font-family="ui-monospace, Menlo, monospace">also: ${vars}, `subshell`</text>
</svg>
